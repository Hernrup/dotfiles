<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The fonts-nerd-font-hack package ships Nerd Fonts v2, which lacks the
       Material Design range (U+F0001-F1AF0) that LazyVim's icons use. It
       claims the same family name as the v3 files in ~/.local/share/fonts and
       wins fc-match, so hide it. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/hack/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
